version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Relational Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: learnpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnpath_db}
      POSTGRES_USER: ${POSTGRES_USER:-learnpath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpath_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnpath_user} -d ${POSTGRES_DB:-learnpath_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learnpath-network

  # ============================================================================
  # 2. FastAPI AI & ML Microservice
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: learnpath-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-in_memory}
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ai_service_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - learnpath-network

  # ============================================================================
  # 3. Spring Boot 3 Java 21 Main Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnpath-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnpath_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learnpath_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-learnpath_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - learnpath-network

  # ============================================================================
  # 4. React Vite TypeScript Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_AI_SERVICE_URL: http://localhost:8000/api/v1
    container_name: learnpath-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - learnpath-network

networks:
  learnpath-network:
    driver: bridge

volumes:
  postgres_data:
  ai_service_data:
